name: "CodeQL Bundle: Create bundle"
description: "Action to build custom CodeQL bundles"
inputs:
  bundle-path:
    description: Path to the bundle to customize
    required: true
  packs:
    description: A comma-separated list of CodeQL packs to include in the bundle
    required: true
  workspace:
    description: Root directory where the codeql-workspace.yml file is located
    required: false
    default: "."
  default-code-scanning-config:
    description: Path to the default code scanning configuration file
    required: false
    default: ""
  platforms:
    description: A comma-separated list of platforms to build the bundle for, if supported by the bundle. Typically used with the generic bundle to build a specific platform bundle on a different runner architecture.
    required: false
    default: ""
  threads:
    description: Number of threads to use when compiling queries
    required: false
    default: ""
  cache-dir:
    description: Directory used for downloaded bundles and compilation caches
    required: false
    default: ""
  cache-manifest:
    description: Path or URL of a supported bundle manifest
    required: false
    default: ""
  no-compilation-cache:
    description: Do not resolve, download, or use published compilation caches
    required: false
    default: "false"
  no-precompile:
    description: Do not precompile the bundle
    required: false
    default: "false"
  debug:
    description: Enable debug logging, by setting this value to "true"
    required: false
    default: "false"
outputs:
  output-path:
    description: Path to the created bundle or directory if multiple platforms are specified
    value: ${{ steps.create-bundle.outputs.output-path }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - run: |
        echo "::group::Installing dependencies"
        echo "Installing codeql-bundle v0.5.0"
        python -m pip install "https://github.com/advanced-security/codeql-bundle/releases/download/v0.5.0/codeql_bundle-0.5.0-py3-none-any.whl"
        echo "::endgroup::"
      shell: bash
    - id: create-bundle
      env:
        BUNDLE_PATH: ${{ inputs.bundle-path }}
        PACKS: ${{ inputs.packs }}
        WORKSPACE: ${{ inputs.workspace }}
        DEFAULT_CODE_SCANNING_CONFIG: ${{ inputs.default-code-scanning-config }}
        PLATFORMS: ${{ inputs.platforms }}
        RUNNER_TEMP: ${{ runner.temp }}
        THREADS: ${{ inputs.threads }}
        CACHE_DIR: ${{ inputs.cache-dir }}
        CACHE_MANIFEST: ${{ inputs.cache-manifest }}
        NO_COMPILATION_CACHE: ${{ inputs.no-compilation-cache }}
        NO_PRECOMPILE: ${{ inputs.no-precompile }}
        DEBUG: ${{ inputs.debug }}
        ACTION_PATH: ${{ github.action_path }}
      shell: bash
      run: bash "${ACTION_PATH}/create-bundle.sh"
